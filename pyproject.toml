[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mousetrapkeys"
version = "0.1.0"
description = "Pinnable, click-through on-screen keyboard and CapsLock cursor layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
# X11 click-through needs the input-shape extension, which python-xlib wraps.
# Not required on Windows.
x11 = ["python-xlib>=0.33"]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
mousetrapkeys = "mousetrapkeys.app:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
